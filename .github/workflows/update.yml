name: 축제 데이터 갱신

on:
  schedule:
    - cron: '7 20 * * *'   # 매일 새벽 5시 7분 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 지도 라이브러리 내려받기(없을 때만)
        run: |
          mkdir -p vendor
          [ -f vendor/leaflet.js ] || {
            curl -sfL -o vendor/leaflet.js https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
            curl -sfL -o vendor/leaflet.css https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
            curl -sfL -o vendor/leaflet.markercluster.js https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js
            curl -sfL -o vendor/MarkerCluster.css https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css
          }
      - name: 벡터 지도 라이브러리 내려받기(없을 때만)
        run: |
          [ -f vendor/maplibre-gl.js ] || curl -sfL -o vendor/maplibre-gl.js https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js
          [ -f vendor/maplibre-gl.css ] || curl -sfL -o vendor/maplibre-gl.css https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css
          [ -f vendor/leaflet-maplibre-gl.js ] || curl -sfL -o vendor/leaflet-maplibre-gl.js https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js
          ls -la vendor
      - name: TourAPI에서 축제 받아오기
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: node scripts/fetch-festivals.mjs
      - name: 변경사항 저장
        run: |
          git config user.name "festival-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data vendor; git add images 2>/dev/null || true
          git diff --staged --quiet || git commit -m "축제 데이터 갱신 $(date +%F)"
          git push
