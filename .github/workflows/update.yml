name: 축제 데이터 갱신

on:
  schedule:
    - cron: '7 20 * * *'   # 매일 새벽 5시 7분 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: TourAPI에서 축제 받아오기
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/fetch-festivals.mjs
      - name: 변경사항 저장
        run: |
          git config user.name "festival-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/festivals.json
          git diff --staged --quiet || git commit -m "축제 데이터 갱신 $(date +%F)"
          git push
