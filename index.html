<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이번주 축제 — 전국 지역 축제 지도</title>
<meta name="description" content="이번 주 열리는 전국 지역 축제를 한눈에. 지역·기간·테마로 검색하고 지도에서 가까운 축제를 찾아보세요.">
<meta property="og:title" content="이번주 축제 — 전국 지역 축제 지도">
<meta property="og:description" content="이번 주 열리는 전국 지역 축제를 지도와 검색으로 찾아보세요.">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#fbf7f2">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="style.css?v=20261101">
</head>
<body>
<header class="top">
  <a class="logo" href="./" aria-label="이번주 축제 홈">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="name">이번주 축제<small>전국 지역 축제 지도</small></span>
  </a>
  <span class="updated" id="updated"></span>
</header>

<section class="hero" aria-labelledby="hero-title">
  <div class="hero-head">
    <p class="kicker" id="weekRange"></p>
    <h1 id="hero-title">이번 주, 어디로 떠나볼까요?</h1>
  </div>
  <div class="hero-track" id="heroTrack"></div>
</section>

<section class="mapsec" aria-label="축제 지도">
  <div class="sec-head"><h2>지도에서 찾기</h2><span id="mapCount"></span></div>
  <div id="map"></div>
</section>

<section class="controls" id="controls">
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="축제명, 지역, 키워드로 찾기" autocomplete="off">
  </div>
  <div class="filters">
    <select id="region" aria-label="지역"><option value="">전국</option></select>
    <select id="period" aria-label="기간">
      <option value="all">전체 기간</option>
      <option value="now">지금 진행 중</option>
      <option value="week" selected>이번 주</option>
      <option value="weekend">이번 주말</option>
      <option value="month">한 달 안</option>
    </select>
  </div>
  <div class="chips" id="themes"></div>
</section>

<div class="viewbar"><span id="count"></span></div>

<main class="body">
  <ul class="list" id="list"></ul>
</main>

<dialog id="detail"></dialog>

<footer class="foot">
  <p>축제 정보: <span id="source">한국관광공사 TourAPI</span><br>
  사진: 한국관광공사(공공누리), Wikimedia Commons(사진별 라이선스 표기). 일정은 주최 측 사정으로 바뀔 수 있으니 방문 전 공식 안내를 확인하세요.</p>
</footer>

<script src="vendor/leaflet.js"></script>
<script>window.L || document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="app.js?v=20261101"></script>
</body>
</html>
